# Liefert den gebauten React-Build statisch aus. SPA-Fallback: jede Route,
# die keiner echten Datei entspricht, bekommt index.html (React Router o. Ae.
# wird zwar aktuell nicht genutzt, macht die Konfiguration aber robust, falls
# spaeter Client-seitiges Routing dazukommt). /api und /health werden bewusst
# NICHT hier behandelt - das macht der vorgelagerte Caddy-Reverse-Proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
